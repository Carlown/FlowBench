name: Marketplace PRs require manual review

# This intentionally preserves the legacy filename. Older FlowBench clients
# only check that the file exists before publishing; it must not auto-merge.
on:
  pull_request_target:
    paths:
      - 'marketplace/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  manual-review-required:
    runs-on: ubuntu-latest
    steps:
      - name: No automated merge
        run: |
          echo "Marketplace submissions are merged only after maintainer review."
